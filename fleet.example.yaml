# fleet.yaml — copy to your config dir ($BOARD_CONFIG_DIR, <repo>/tmp-local/ or
# ~/.config/agent-switchboard/) and edit.

# Run the collector (board-collect) in tmux session "switchboard" from fleet-up.
collector: true
poll_interval: 3              # seconds between snapshot rebuilds
decision_timeout_hours: 24    # pending decisions older than this become "timeout"
resume_fallback_seconds: 15   # fleet-up: start fresh only if `claude -r NAME` exits this fast
# Remote Control (claude.ai/code, the Claude app): fleet-up starts sessions with
# `--remote-control CODE` unless they don't want it. The owner's `board rc on|off CODE|all`
# (or the board's RC toggle) wins over this; a session's own `remote_control:` over this default.
# remote_control: true
# rc:
#   unset_do_not_track: false   # true: start with `env -u DO_NOT_TRACK` (Claude ignores RC while it is set)
# Session actions (/compact, /remote-control typed into idle sessions, docs/contract.md):
# session_actions:
#   auto_apply: true            # the collector runs pending actions when a session goes idle
#   queue_hours: 12             # a queued compact older than this is dropped
#   compact_seconds: 600        # how long to watch a compact before reporting "started"

# Who may decide: board user ids (the artifact page's user.id()), or with the self-hosted board
# emails and "local".
# Empty `approvers` fails closed: every answer is refused until you add someone. A production
# decision (gate or stage "production") needs `release_managers` (falls back to `approvers`).
approvers: []
release_managers: []
# Who administers API keys (`board apikey`, docs/contract.md "API keys"): issue a key to anyone,
# approve key requests, revoke, rotate, set or extend expiry, change scopes. Owners sit above
# approvers for key administration only; answering still needs `approvers`. Empty = nobody can
# approve a key request (approvers can still issue keys to listed people or themselves).
owners: []
# owners: [owner@example.com, owner.backup@example.com]
# apikeys:
#   request_ttl_days: 14     # a key request no owner approved by then lapses (1-90)

# Self-hosted board (bin/board-serve, 127.0.0.1 only); fleet-up starts it when enabled.
# Its approvers / release_managers are emails (verified by Cloudflare Access) and "local"
# (any process on this machine, other OS users included: only list it on a single-user host);
# the Artifact board uses claude.ai user ids.
# Empty approvers = every answer refused. See README "Two channels".
serve:
  enabled: false
  port: 39410                        # local listener: identity "local", direct browser only
  # tunnel:                          # the listener cloudflared points at (never "local")
  #   enabled: true
  #   port: 39411
  #   hostname: board.example.com
  #   team_domain: yourteam.cloudflareaccess.com
  #   aud: "<Application Audience (AUD) Tag>"   # needs python3 cryptography to verify tokens
  #   allowed_emails: [viewer@example.com]     # who may open it at all (default: approvers ∪ release_managers)
  #   api_service_tokens: [<client id>.access] # Access service tokens (common_name) allowed on /api/v1
  # The public read-only API, /api/v1 (docs/contract.md "Public API"): a board API key
  # (`board apikey`) on every call. On the tunnel also a verified Access service token from
  # api_service_tokens (or an allowed email), so the internet never reaches it unauthenticated.
  # api:
  #   enabled: true                    # false: /api/v1 is off on both listeners
  #   remote: true                     # false: local listener only (the tunnel answers 403)
  #   auth_fail_per_min: 10            # failed key checks per source before 429

# Public URL of the board (the self-hosted board behind Cloudflare Access). When set, alerts carry a
# link that opens the board on the item: <board_url>/?d=<decision id> (?c= consensus, ?m= message),
# or the board root for usage, limit and operator alerts. https only (http only for 127.0.0.1 or
# localhost), no user name, query or fragment. Env BOARD_PUBLIC_URL (process or .env) overrides it.
# Unset: alerts carry no board link. `board doctor` says whether it is accepted.
# board_url: https://board.example.com

# System resources (lib/resources.py): the collector samples memory, swap, load, disks, OOM kills
# and each session's processes and teammates every `interval` seconds into resources.json. Alerts
# res:mem / res:swap / res:disk:<id> (warn -> high), res:oom:<n> and res:idle-teammates:<code>.
# The board shows them; it never stops a process. `board resources` prints the last sample.
# resources:
#   enabled: true
#   interval: 15
#   disks: auto                 # BOARD_HOME + each live session's cwd (network/FUSE mounts skipped);
#                               # or a list of paths (always probed, 2 s budget)
#   thresholds:                 # [warn, high]; critical = high for 2 samples, or an OOM kill
#     mem_available_pct: [15, 8]
#     mem_available_mb:  [2048, 1024]
#     swap_used_pct:     [50, 80]
#     psi_mem_some_avg60: [10, 25]
#     load_per_cpu:      [1.5, 3.0]
#     disk_free_pct:     [10, 3]
#     disk_free_mb:      [5120, 1024]
#   teammate_idle_minutes: 30   # a teammate idle this long is flagged (and alerted, info/warn)
#   # process_classes: {test: "regex", browser: "regex", build: "regex", container: "regex"}

# Operator health (local mode, serve.enabled): operator:stale alerts (high, urgent after 30 min)
# when operator.json's heartbeat is older than this, or board-serve --watch is not running, and an
# answer or message waits to be relayed.
# schedule:
#   operator_stale_minutes: 10
# The scheduler (lib/scheduler.py, on by default): which tasks may start now and the advisories,
# in $BOARD_HOME/scheduler.json (`board schedule`). See docs/contract.md, "Scheduler".
#   enabled: true
#   max_heavy_concurrent: auto  # heavy tasks at once; auto = 1 under 16 GiB of memory, else 2
#   one_pr_per_repo: true       # one open PR per repo; other tasks there hold their push
#   stall_minutes: [45, 90]     # a running task with no progress this long: stuck warn / high
#   idle_with_work_minutes: 30  # an idle session with a ready task this long: `resume` (info)
#   stop_own_heavy: true        # at critical memory, ask a session to stop its own heavy process
#   stop_max: 2                 # ... at most this many sessions at once, largest first
#   advise: true                # send advisories to sessions; false = shadow mode (board only)
#   readvise_minutes: 60        # re-send one nobody answered after this long
#   max_messages_per_session_hour: 4
#   human_wait_minutes: 10      # J1: every session with work waits on the owner this long
#   conserve: {five_hour_pct: 85, margin_minutes: 20, weekly_pace_slack_pct: 15}
# What the scheduler learns from jams (lib/lessons.py, lessons.jsonl; `board lesson ...`).
# lessons:
#   enabled: true
#   min_lost_minutes: 10        # a resolved jam that cost less (minutes x sessions) is not kept
#   auto_activate_after: 2      # a candidate seen this many times becomes active (rules only tighten)
#   ttl_days: 30                # an auto lesson unseen and unused this long is retired

# Session cards on the self-hosted board (lib/cards.py). The last message and prompt are shown to
# approvers only; show_prompt: false stops the collector from keeping the prompt at all.
# cards:
#   show_prompt: true

# `board press` safety settings: a key is only sent when the last `lines` lines of the pane
# match `prompt_regex` (permission prompts) or `question_regex` (an AskUserQuestion picker; its
# option is chosen with its number key, free text through "Type something"). A form of several
# questions: only lines after its tab bar (`tabbar_regex`) count; it ends on a review screen
# (`review_regex`) whose `submit_label` row (plain text, not a pattern) is picked by its number.
press:
  prompt_regex: 'Do you want to (proceed|make this edit|create|overwrite|allow)'
  question_regex: 'Enter to select.*navigate'
  free_text_label: 'Type something'
  tabbar_regex: '^[[:space:]]*←.*(☐|☒).*Submit.*→'
  review_regex: 'Review your answers'
  focus_regex: '(❯|>|›)'   # the marker of the focused picker row
  submit_label: 'Submit answers'
  # The TUI scrolled up with a prompt open (one of its last 2 non-blank lines is, as a whole line,
  # "4 new messages (ctrl+End) ↓"): press sends scroll_key once (scrolls to the bottom, never submits
  # in Claude Code's TUI), then checks the screen again.
  scrolled_regex: '^[[:space:]]*[0-9]+ new messages? .*ctrl\+End.*$'
  scroll_key: C-End
  # Before any key the pane's current command must be the TUI: claude, claude.exe, node or a
  # version number X.Y.Z (the native installer's binary). '' = not checked.
  tui_command_regex: '^(claude(\.exe)?|node|[0-9]+(\.[0-9]+){2})$'
  lines: 30
  allow_keys: ["1"]
  deny_keys: ["Escape"]

# One entry per Claude Code session. `code` is the tmux session name and the session's
# short name on the board.
sessions:
  - code: BOARD
    cwd: ~/work
    autostart: true
    resume: false             # always start fresh (default true: `claude -r resume_name` first)
    extra_args: "--verbose"
    # First prompt of a fresh session: one line (newlines become spaces), passed as one quoted argument.
    initial_prompt: "You are the BOARD operator. Read prompts/board-operator.md and start the operator loop."
  - code: API
    cwd: ~/work/api
    autostart: false
    resume_name: API          # `claude -r API`; fresh only if that exits within resume_fallback_seconds
    aliases: [api-main]       # registry names that also mean this session
  - code: WEB
    cwd: ~/work/web
    autostart: false
    remote_control: false     # fleet-up starts it without --remote-control

# Pomodoro tally (lib/pomodoro.py; README "Pomodoro"): each session runs a pomodoro while it works.
# pomodoro:
#   enabled: true
#   focus_minutes: 25           # one pomodoro (every session and every teammate runs its own)
#   mode: accumulate            # focus adds up across breaks; strict: a break longer than grace resets
#   grace_minutes: 2            # strict: a done/idle gap up to this long pauses; longer resets
#   teammate_idle_s: 60         # a teammate idle (per the resources sampler) this long is on a break
#   timezone: ""                # day rollover at local midnight here (IANA name); empty = the system's
#   notify: false               # info notification at every notify_every-th fleet pomodoro of the day
#   notify_every: 10

# Aliases can also be given here: CODE -> [alias, ...]
# aliases:
#   WEB: [frontend]

# Alerting (bin/board-notify). Channels are enabled by their variables in .env.
# alerting:
#   routes:                     # level -> channels (defaults shown)
#     info:   [slack]
#     warn:   [slack, desktop]
#     high:   [slack, desktop, email]
#     urgent: [slack, desktop, email, line, sns, webhook]
#   quiet_hours: "23:00-08:00"  # local time; only urgent is delivered, the rest is held until it ends
#   repeat_minutes: 60          # re-alert an unacked key at the same level after this long (0 = never)
#   escalate_minutes: {high: 10, urgent: 30, permission_urgent: 10}
#   thresholds: [80, 90, 95]    # usage % -> warn / high / urgent, once per threshold per reset window
#   min_level: {}               # triage floors: a level (everything) or {all: warn, email: high};
#                               # `board notify-level` overrides them (README "Quieting the board")
#   presence:                   # while an approver watches the self-hosted board, hold push below min_level
#     reduce: true
#     min_level: high
#     window_seconds: 120       # a heartbeat at most this old
#     idle_seconds: 900         # and an interaction at most this old (0 = no idle limit)
# Urgent always breaks through mutes and presence, unless a mute has --include-urgent.

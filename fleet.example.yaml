# fleet.yaml — copy to your config dir ($BOARD_CONFIG_DIR, <repo>/tmp-local/ or
# ~/.config/agent-switchboard/) and edit.

# Run the collector (board-collect) in tmux session "switchboard" from fleet-up.
collector: true
poll_interval: 3              # seconds between snapshot rebuilds
decision_timeout_hours: 24    # pending decisions older than this become "timeout"
resume_fallback_seconds: 15   # fleet-up: start fresh only if `claude -r NAME` exits this fast
# Remote Control (claude.ai/code, the Claude app): fleet-up starts sessions with
# `--remote-control CODE` unless they don't want it. The owner's `board rc on|off CODE|all`
# (or the board's RC toggle) wins over this; a session's own `remote_control:` over this default.
# remote_control: true
# rc:
#   unset_do_not_track: false   # true: start with `env -u DO_NOT_TRACK` (Claude ignores RC while it is set)
# Session actions (/compact, /remote-control typed into idle sessions, docs/contract.md):
# session_actions:
#   auto_apply: true            # the collector runs pending actions when a session goes idle
#   queue_hours: 12             # a queued compact older than this is dropped
#   compact_seconds: 600        # how long to watch a compact before reporting "started"
# Resume after a usage limit (`board resume CODE...|--all`, the board's Resume buttons; owners only;
# docs/contract.md "Resume after a usage limit"). The screen patterns default to Claude Code 2.1.x;
# override one only when Claude Code changes its screens (Python regexes).
# limit_resume:
#   prompt: "Quota is available again. Continue where you left off."
#   scan_seconds: 30            # the collector's background look at the panes; 0 = never
#   confirm_seconds: 10         # how long to wait for each next screen, and for the session to work
#   esc_gap_seconds: 1.5        # Escapes to one session at least this far apart (double Escape = rewind)
#   max_steps: 4
#   lines: 40                   # how much of the pane is read
#   limit_regex: '(claude (ai )?)?usage limit (reached|has reset|reset)|you.ve hit your (usage |session |weekly )?limit|...'
#   dialog_title_regex: 'What do you want to do\?'
#   dialog_row_regex: '^(\d+\.\s*)?(Stop and wait for limit to reset|Upgrade your plan|...)\s*$'
#   dialog_stop_regex: '^(\d+\.\s*)?Stop\s*$'
#   dialog_footer_regex: 'Esc to cancel'
#   wait_regex: 'continuing (automatically|shortly)\b.*esc to cancel'
#   ready_regex: 'press enter to continue'
#   prefill: continue

# Who may decide: board user ids (the artifact page's user.id()), or with the self-hosted board
# emails and "local".
# Empty `approvers` fails closed: every answer is refused until you add someone. A production
# decision (gate or stage "production") needs `release_managers` (falls back to `approvers`).
approvers: []
release_managers: []
# Askers (self-hosted board): people who see the board as a viewer does and may only send messages
# to sessions (@CODE, or @triage: the operator routes it to the sessions whose `about` fits; never
# @all, which interrupts every session). They answer nothing, release nothing, change no settings
# and read no tickets. Their messages reach sessions labelled as theirs ([BOARD asker <id>] from
# <email>), information only, at most 10 per 10 minutes. Emails (and "local"), matched like approvers.
askers: []
# askers: [teammate@example.com]
# The board's owners. On the self-hosted board only an owner (who is also an approver) answers
# permission prompts and pane questions, releases held messages, sets owner-away, changes
# notification settings and acks alerts, uses Remote Control and session actions, and edits
# lessons; only an owner's presence holds back pushes. With empty owners, approvers count as owners.
# Owners also administer API keys (`board apikey`, docs/contract.md "API keys"):
# issue a key to anyone, approve key requests, revoke, rotate, set or extend expiry, change scopes;
# empty = nobody can approve a key request (approvers can still issue keys to listed people or
# themselves). Only owners see the Claude account email the sessions run on; with empty owners,
# approvers see it (a single-user board), and `board doctor` reminds you to set owners.
# Answering still needs `approvers`.
owners: []
# owners: [owner@example.com, owner.backup@example.com]
# Do not disturb (`board dnd on|off`, or the profile menu): the owner is present, but askers'
# messages and work requests get a canned reply from BOARD and reach no session. The same happens
# on its own while compute is short (5-hour usage >= five_hour_pct, 7-day >= seven_day_pct, or a
# usage limit is hit). Replies: one line, at most 300 characters; defaults in English + 繁體中文.
# availability:
#   dnd_reply: "Heads down today. Please ask again tomorrow."
#   compute_reply: "Busy right now. Please try again later."
#   away_reply: "Away this week. Please ask again next Monday."   # while away, when the owner chose
#                                                                 # "decline" for askers (profile menu)
#   compute: {enabled: true, five_hour_pct: 90, seven_day_pct: 95, limit: true}
# apikeys:
#   request_ttl_days: 14     # a key request no owner approved by then lapses (1-90)

# Local asker desk (lib/desk.py; docs/contract.md "Local asker desk"): askers are answered by a Claude
# Code session that runs against a LOCAL Anthropic-compatible model endpoint, whenever it answers and
# that session is alive: zero Claude tokens (board code types a fixed line into the desk's pane, the
# desk posts its answer into the thread, marked "local model"). It goes before do-not-disturb and
# compute-low. Endpoint down, desk not running, no looping collector, or no answer in
# reply_timeout_s: today's flow. The desk is read-only: fleet-up starts it with `lib/desk.py run`
# (--restricted, only Read/Grep/Glob, permission mode dontAsk, a generated deny list for secret-ish
# paths, no hooks, only the env_file's model variables), in its own EMPTY directory
# ($BOARD_HOME/desk/cwd): it reads only `repos`, never a parent directory. Add its session below
# (code = `session`, autostart; its cwd is not used). Each repo should be a folder you have opened
# Claude Code in before (trusted), or the desk's pane asks "add this directory?" at every start.
# The endpoint must be loopback or a private address (allow_remote: true to allow another).
# env_file lives in the config dir (gitignored) and holds the endpoint and its token, never this file:
#   ANTHROPIC_BASE_URL=http://127.0.0.1:8080
#   ANTHROPIC_AUTH_TOKEN=<token>
#   ANTHROPIC_MODEL=<model name>                 # the session's model
#   ANTHROPIC_DEFAULT_SONNET_MODEL=<model name>  # what the "sonnet"/"opus"/"haiku" aliases mean
#   ANTHROPIC_DEFAULT_OPUS_MODEL=<model name>
#   ANTHROPIC_DEFAULT_HAIKU_MODEL=<model name>   # background tasks (titles, summaries)
#   API_TIMEOUT_MS=600000                        # a slow first prompt
#   CLAUDE_CODE_MAX_CONTEXT_TOKENS=65536         # a small context window (unknown models count as large)
# local_model:
#   enabled: true
#   session: ASK
#   env_file: local-model.env   # relative to the config dir
#   health: {url: "", timeout_s: 2, cache_s: 30}   # url "": <ANTHROPIC_BASE_URL>/v1/models
#   reply_timeout_s: 600        # no answer by then (queued time counts): the usual way
#   max_reply_chars: 2000       # a longer answer is cut
#   repos: [~/work/api, ~/work/web]   # --add-dir: the only places the desk reads (list each repo)
#   deny_paths: ["**/customer-data/**"]   # never readable, on top of the built-in deny list
#   allow_remote: false         # true: the endpoint may be a public address or a host name
#   # A WORK request (asks someone to review, merge, deploy, fix, run ...) always gets a "forward to
#   # a session?" card for the owner (lib/desk.py classify). A message sent to one session or with
#   # @CODE always counts; these tune the word heuristic for the rest. Lists ADD to the built-in
#   # ones; an ASCII word or phrase matches as a word (verbs also with -s/-ed/-ing), anything else
#   # is a Python regex.
#   work_patterns:
#     enabled: true             # false: only "sent to a session" and @CODE count
#     defaults: true            # false: drop the built-in lists (yours only)
#     verbs: ["take a look"]    # what someone is asked to do
#     requests: ["could we"]    # asking words ("please", "請"); a verb must follow, no question word between
#     questions: []             # words that make it a question ("explain", "怎麼")
#     refs: ['TICKET-\d+']      # references that, with a verb, make it a request (MR/PR links built in)
#     done: ["shipped it"]      # words that make a sentence a report, not a request ("thanks", "已經")
#   # A regex here is yours to keep sane: one that backtracks badly can be slow on long messages
#   # (only the first 2000 characters are classified).

# Self-hosted board (bin/board-serve, 127.0.0.1 only); fleet-up starts it when enabled.
# Its approvers / release_managers are emails (verified by Cloudflare Access) and "local"
# (any process on this machine, other OS users included: only list it on a single-user host);
# the Artifact board uses claude.ai user ids.
# Empty approvers = every answer refused. See README "Two channels".
serve:
  enabled: false
  port: 39410                        # local listener: identity "local", direct browser only
  # tunnel:                          # the listener cloudflared points at (never "local")
  #   enabled: true
  #   port: 39411
  #   hostname: board.example.com
  #   team_domain: yourteam.cloudflareaccess.com
  #   aud: "<Application Audience (AUD) Tag>"   # needs python3 cryptography to verify tokens
  #   allowed_emails: [viewer@example.com]     # who may open it at all (default: approvers ∪ release_managers ∪ askers)
  #   api_service_tokens:                    # Access service tokens (common_name) allowed on /api/v1,
  #     <alice's client id>.access: alice@example.com   # each bound to the people whose API keys
  #     <bob's client id>.access: bob@example.com       # may come with it (one token per person)
  # The public read-only API, /api/v1 (docs/contract.md "Public API"): a board API key
  # (`board apikey`) on every call. On the tunnel also a verified Access service token from
  # api_service_tokens (or an allowed email), so the internet never reaches it unauthenticated.
  # api:
  #   enabled: true                    # false: /api/v1 is off on both listeners
  #   remote: true                     # false: local listener only (the tunnel answers 403)
  #   auth_fail_per_min: 10            # failed key checks per source before 429

# Public URL of the board (the self-hosted board behind Cloudflare Access). When set, alerts carry a
# link that opens the board on the item: <board_url>/?d=<decision id> (?c= consensus, ?m= message),
# or the board root for usage, limit and operator alerts. https only (http only for 127.0.0.1 or
# localhost), no user name, query or fragment. Env BOARD_PUBLIC_URL (process or .env) overrides it.
# Unset: alerts carry no board link. `board doctor` says whether it is accepted.
# board_url: https://board.example.com

# System resources (lib/resources.py): the collector samples memory, swap, load, disks, OOM kills
# and each session's processes and teammates every `interval` seconds into resources.json. Alerts
# res:mem / res:swap / res:disk:<id> (warn -> high), res:oom:<n> and res:idle-teammates:<code>.
# The board shows them; it never stops a process. `board resources` prints the last sample.
# resources:
#   enabled: true
#   interval: 15
#   disks: auto                 # BOARD_HOME + each live session's cwd (network/FUSE mounts skipped);
#                               # or a list of paths (always probed, 2 s budget)
#   thresholds:                 # [warn, high]; critical = high for 2 samples, or an OOM kill
#     mem_available_pct: [15, 8]
#     mem_available_mb:  [2048, 1024]
#     swap_used_pct:     [50, 80]
#     psi_mem_some_avg60: [10, 25]
#     load_per_cpu:      [1.5, 3.0]
#     disk_free_pct:     [10, 3]
#     disk_free_mb:      [5120, 1024]
#   teammate_idle_minutes: 30   # a teammate idle this long is flagged (and alerted, info/warn)
#   # process_classes: {test: "regex", browser: "regex", build: "regex", container: "regex"}

# Committee advice (`board advise`, docs/contract.md "Committee advice"): while the owner is away,
# sessions may attach advice to a pending board ask. If the owner opts in, a unanimous recommendation
# becomes the decision ("Committee decisions"; off by default); that is the owner's own setting, kept in
# $BOARD_HOME/away-decisions.json (`board away decisions`, the profile menu), not here. BOARD sends
# each concerned session at most one low-priority digest this often (5-1440); no per-question pings.
# advice:
#   digest_minutes: 60

# Operator health (local mode, serve.enabled): operator:stale alerts (high, urgent after 30 min)
# when operator.json's heartbeat is older than this, or board-serve --watch is not running, and an
# answer or message waits to be relayed.
# schedule:
#   operator_stale_minutes: 10
# The scheduler (lib/scheduler.py, on by default): which tasks may start now and the advisories,
# in $BOARD_HOME/scheduler.json (`board schedule`). See docs/contract.md, "Scheduler".
#   enabled: true
#   max_heavy_concurrent: auto  # heavy tasks at once; auto = 1 under 16 GiB of memory, else 2
#   one_pr_per_repo: true       # one open PR per repo; other tasks there hold their push
#   stall_minutes: [45, 90]     # a running task with no progress this long: stuck warn / high
#   idle_with_work_minutes: 30  # an idle session with a ready task this long: `resume` (info)
#   stop_own_heavy: true        # at critical memory, ask a session to stop its own heavy process
#   stop_max: 2                 # ... at most this many sessions at once, largest first
#   advise: true                # send advisories to sessions; false = shadow mode (board only)
#   readvise_minutes: 60        # re-send one nobody answered after this long
#   max_messages_per_session_hour: 4
#   human_wait_minutes: 10      # J1: every session with work waits on the owner this long
#   conserve: {five_hour_pct: 85, margin_minutes: 20, weekly_pace_slack_pct: 15}
# What the scheduler learns from jams (lib/lessons.py, lessons.jsonl; `board lesson ...`).
# lessons:
#   enabled: true
#   min_lost_minutes: 10        # a resolved jam that cost less (minutes x sessions) is not kept
#   auto_activate_after: 2      # a candidate seen this many times becomes active (rules only tighten)
#   ttl_days: 30                # an auto lesson unseen and unused this long is retired

# Session cards on the self-hosted board (lib/cards.py). The last message and prompt are shown to
# approvers only; show_prompt: false stops the collector from keeping the prompt at all.
# cards:
#   show_prompt: true

# `board press` safety settings: a key is only sent when the last `lines` lines of the pane
# match `prompt_regex` (permission prompts) or `question_regex` (an AskUserQuestion picker; its
# option is chosen with its number key, free text through "Type something"). A form of several
# questions: only lines after its tab bar (`tabbar_regex`) count; it ends on a review screen
# (`review_regex`) whose `submit_label` row (plain text, not a pattern) is picked by its number.
# A multi-select question ("1. [ ] label" rows): only the boxes that differ from the answer are
# toggled by their numbers, then `next_key` (Right or Tab) moves on.
press:
  prompt_regex: 'Do you want to (proceed|make this edit|create|overwrite|allow)'
  question_regex: 'Enter to select.*navigate'
  free_text_label: 'Type something'
  tabbar_regex: '^[[:space:]]*←.*(☐|☒).*Submit.*→'
  review_regex: 'Review your answers'
  focus_regex: '(❯|>|›)'   # the marker of the focused picker row
  submit_label: 'Submit answers'
  next_key: Right             # leaves a multi-select question (Right or Tab, never Enter)
  # The TUI scrolled up with a prompt open (one of its last 2 non-blank lines is, as a whole line,
  # "4 new messages (ctrl+End) ↓"): press sends scroll_key once (scrolls to the bottom, never submits
  # in Claude Code's TUI), then checks the screen again.
  scrolled_regex: '^[[:space:]]*[0-9]+ new messages? .*ctrl\+End.*$'
  scroll_key: C-End
  # Before any key the pane's current command must be the TUI: claude, claude.exe, node or a
  # version number X.Y.Z (the native installer's binary). '' = not checked.
  tui_command_regex: '^(claude(\.exe)?|node|[0-9]+(\.[0-9]+){2})$'
  # A shortened question taller than the pane: its start may be up to scrollback_lines above the
  # screen (0 = it must be on screen). It counts only from its last occurrence, with every option
  # label after it, the picker footer at the bottom of the screen, and no line matching turn_regex
  # (another turn: the "●"/"⏺" bullet, the "❯" prompt; a focused "❯ 2." row is not one) in between.
  scrollback_lines: 200
  turn_regex: '^[[:space:]]*(●|⏺|❯)'
  lines: 30
  allow_keys: ["1"]
  deny_keys: ["Escape"]

# One entry per Claude Code session. `code` is the tmux session name and the session's
# short name on the board.
# `about`: one line on what the session is responsible for (at most 120 characters, plain text).
# The board shows it next to the session in the message composer, and the operator uses it to route
# a message sent to "triage". The codes "all" and "triage" are reserved.
sessions:
  - code: BOARD
    cwd: ~/work
    about: "the board operator: relays answers and messages"
    autostart: true
    resume: false             # always start fresh (default true: `claude -r resume_name` first)
    extra_args: "--verbose"
    # First prompt of a fresh session: one line (newlines become spaces), passed as one quoted argument.
    initial_prompt: "You are the BOARD operator. Read prompts/board-operator.md and start the operator loop."
  - code: API
    cwd: ~/work/api
    about: "backend API and database migrations"
    autostart: false
    resume_name: API          # `claude -r API`; fresh only if that exits within resume_fallback_seconds
    aliases: [api-main]       # registry names that also mean this session
  - code: WEB
    cwd: ~/work/web
    about: "frontend app"
    autostart: false
    remote_control: false     # fleet-up starts it without --remote-control
  # - code: ASK                 # the local asker desk (local_model.session): started by lib/desk.py run
  #   cwd: ~                    # not used: the desk runs in $BOARD_HOME/desk/cwd
  #   about: "answers askers from the repos (local model, read-only)"
  #   autostart: true

# Pomodoro tally (lib/pomodoro.py; README "Pomodoro"): each session runs a pomodoro while it works.
# pomodoro:
#   enabled: true
#   focus_minutes: 25           # one pomodoro (every session and every teammate runs its own)
#   mode: accumulate            # focus adds up across breaks; strict: a break longer than grace resets
#   grace_minutes: 2            # strict: a done/idle gap up to this long pauses; longer resets
#   teammate_idle_s: 60         # a teammate idle (per the resources sampler) this long is on a break
#   timezone: ""                # day rollover at local midnight here (IANA name); empty = the system's
#   notify: false               # info notification at every notify_every-th fleet pomodoro of the day
#   notify_every: 10

# Aliases can also be given here: CODE -> [alias, ...]
# aliases:
#   WEB: [frontend]

# Alerting (bin/board-notify). Channels are enabled by their variables in .env.
# alerting:
#   routes:                     # level -> channels (defaults shown)
#     info:   [slack]
#     warn:   [slack, desktop]
#     high:   [slack, desktop, email]
#     urgent: [slack, desktop, email, line, sns, webhook]
#   quiet_hours: "23:00-08:00"  # local time; only urgent is delivered, the rest is held until it ends
#   repeat_minutes: 60          # re-alert an unacked key at the same level after this long (0 = never)
#   escalate_minutes: {high: 10, urgent: 30, permission_urgent: 10}
#   thresholds: [80, 90, 95]    # usage % -> warn / high / urgent, once per threshold per reset window
#   min_level: {}               # triage floors: a level (everything) or {all: warn, email: high};
#                               # `board notify-level` overrides them (README "Quieting the board")
#   presence:                   # while an approver watches the self-hosted board, hold push below min_level
#     reduce: true
#     min_level: high
#     window_seconds: 120       # a heartbeat at most this old
#     idle_seconds: 900         # and an interaction at most this old (0 = no idle limit)
# Urgent always breaks through mutes and presence, unless a mute has --include-urgent.

# Reminders (lib/reminders.py; `board remind`, the board's ⏰ Reminders panel): the owner's own alarms.
# The collector sends a notice `lead` minutes before and one at the time, at the reminder's level,
# through mutes unless the reminder says --no-breakthrough. Only owners (else approvers) see them.
# reminders:
#   default_lead_min: 5
#   default_level: high         # info | warn | high | urgent
#   timezone: ""                # IANA name for wall times (e.g. Asia/Taipei); empty = this machine's

# Tickets (lib/tickets; docs/contract.md "Tickets"): read issue-tracker tickets with
# `board ticket get REF` and the board's GET /api/tickets/<ref> (approvers and release managers only).
# REF is KEY or tracker:KEY. A KEY that several trackers' key_pattern match is refused as ambiguous,
# so list your project prefixes rather than a catch-all like '[A-Z]+-[0-9]+'.
# Tokens: never here. `env:` names a variable (process env, else <config dir>/.env), or
# `token_file:` a 0600 file (relative to the config dir). `board ticket doctor` says set/unset only.
# Requests: https only (http only for 127.0.0.1/localhost), never to another host than base_url,
# redirects not followed, 10 s timeout, 1 MiB answers.
# tickets:
#   cache_ttl_seconds: 60       # a fetched ticket is served from $BOARD_HOME/tickets/cache this long
#   not_found_ttl_seconds: 30   # a 404 is remembered this long
#   comment_identity: false     # comments end with "(via agent-switchboard)"; true adds ", by <identity>"
#   trackers:
#     - name: tracker           # [a-z][a-z0-9_-]{0,31}; the "tracker:" of tracker:KEY
#       type: http-json         # a JSON API described here; `fake` reads fixtures (tests, demos)
#       base_url: https://tracker.example.com
#       auth: {header: Authorization, scheme: Bearer, env: EXAMPLE_TRACKER_TOKEN}   # or {token_file: tracker.token}, or: none
#       key_pattern: '^(WEB|API)-[0-9]+$'
#       rate_per_min: 30          # token bucket; a 429's Retry-After is honoured (waited out once when
#       retry_wait_max_seconds: 2 # at most this long, else no requests until it passes); 5 failures
#                                 # in a row pause the tracker for 60 s
#       resolve:                  # optional: display key -> internal ids; `set` names variables
#         method: GET
#         path: /api/v1/issues/resolve
#         query: {displayId: "{key}"}
#         set: {id: "$.data.id", project: "$.data.project"}   # paths: $ .name [n] [?field=={var}]
#       get:
#         method: GET
#         path: "/api/v1/projects/{project}/issues/{id}"       # each {var} is one encoded path segment
#         map: {title: $.data.title, status: $.data.status, assignee: $.data.assigneeName,
#               description: $.data.description, updated_at: $.data.updatedAt}
#         link: "https://tracker.example.com/projects/{project}/issues/{key}"
#         status_category: {todo: [backlog, todo], doing: [in_progress], done: [done, cancelled]}
#       # Writes (optional; approvers only). Values are typed into the parsed body, never pasted into JSON text.
#       comment:    {method: POST,  path: "/api/v1/projects/{project}/issues/{id}/comments", body: {body: "{text}"}, ref: "$.data.id"}
#       transition: {method: PATCH, path: "/api/v1/projects/{project}/issues/{id}", body: {status: "{to}"},
#                    states: [backlog, todo, in_progress, done, cancelled]}
#       assign:     {method: PATCH, path: "/api/v1/projects/{project}/issues/{id}", body: {assigneeName: "{who}"}}
#       # What `board ticket take` does on the tracker (each optional; a failure leaves the take "partial").
#       take: {transition: in_progress, assign: "Board Bot", comment: "Picked up as {task_id} ({session})."}
#     - name: demo
#       type: fake                # fixtures: tests/fixtures/tickets/fake.json (or `fixtures: PATH`)
#       key_pattern: '^DEMO-[0-9]+$'

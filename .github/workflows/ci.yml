name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Only needed when the repository belongs to an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s bash bin/board bin/board-collect bin/fleet-up hooks/board-hook.sh \
            scripts/install.sh scripts/setup-dev.sh tests/run.sh .githooks/pre-commit .githooks/commit-msg \
            bin/board-notify hooks/board-statusline-tap.sh tests/test_notify.sh \
            bin/board-serve scripts/expose-cloudflare.sh tests/test_serve.sh tests/test_away.sh \
            tests/test_notify_controls.sh

  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: README translations keep the heading structure; no literal ** in bold
        run: python3 scripts/check-readme-sync.py README.md README.zh-TW.md

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq tmux python3-yaml python3-cryptography curl bsdextrautils util-linux
      - name: gitleaks binary (the API key rule test runs it)
        run: |
          v=8.30.1; f="gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/$f" | sha256sum -c -
          sudo tar -xzf "/tmp/$f" -C /usr/local/bin gitleaks
      - name: tests
        run: tests/run.sh -v
      - name: notify tests
        run: tests/test_notify.sh -v
      - name: notification controls tests
        run: tests/test_notify_controls.sh -v
      - name: serve tests
        run: tests/test_serve.sh -v
      - name: away / consensus tests
        run: tests/test_away.sh -v
      - name: resources tests
        run: python3 tests/test_resources.py -v
      - name: secret guard tests
        run: python3 tests/test_guard.py -v
      - name: card extras tests
        run: python3 tests/test_cards.py -v
      - name: remote control tests
        run: python3 tests/test_rc.py -v
      - name: pomodoro tests
        run: python3 tests/test_pomodoro.py -v
      - name: scheduler tests
        run: python3 tests/test_scheduler.py -v
      - name: scheduler advisories and jams tests
        run: python3 tests/test_advisories.py -v
      - name: lessons tests
        run: python3 tests/test_lessons.py -v
      - name: API keys tests
        env:
          APIKEYS_REQUIRE_GITLEAKS: "1"
        run: python3 tests/test_apikeys.py -v
      - name: public API (/api/v1) tests
        env:
          API_REQUIRE_CRYPTO: "1"
        run: python3 tests/test_api_v1.py -v
      - name: MCP server (bin/board-mcp, POST /mcp) tests
        env:
          MCP_REQUIRE_CRYPTO: "1"
        run: python3 tests/test_mcp.py -v
      - name: tickets tests
        run: python3 tests/test_tickets.py -v
      - name: ticket take tests
        run: python3 tests/test_tickets_take.py -v
      - name: askers tests
        env:
          ASKERS_REQUIRE_CRYPTO: "1"
        run: python3 tests/test_askers.py -v
      - name: PII masking tests (who sees whose email)
        env:
          PII_REQUIRE_CRYPTO: "1"
        run: python3 tests/test_pii.py -v
      - name: reminders tests
        run: python3 tests/test_reminders.py -v
      - name: roles tests (owner / approver / asker / viewer)
        env:
          ROLES_REQUIRE_CRYPTO: "1"
        run: python3 tests/test_roles.py -v
